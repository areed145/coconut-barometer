[project]
name = "coconut-barometer"
version = "0.1.0"
description = "Auto-tag and album-sort a Flickr library using geotags and vision LLMs"
requires-python = ">=3.10"
dependencies = [
    "flickrapi>=2.4",
    "pyyaml>=6",
    "requests>=2.28",
    "reverse_geocoder>=1.5",
    "pycountry>=22",
    "anthropic>=0.40",
    "fastapi>=0.156.1",
    "uvicorn>=0.54.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "duckdb>=1.4.0",
    "websockets>=13",
    "aprslib>=0.7",
    "pywebpush>=2.5.0",
    "pillow>=12.3.0",
    "contourpy>=1.3.2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]   # also used for Ollama / other OpenAI-compatible servers

# `uv sync` installs the project (editable) plus the dev group; `uv sync --no-dev` for a server.
[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[project.scripts]
coconut-barometer = "coconut_barometer.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["coconut_barometer*"]

[tool.setuptools.package-data]
"coconut_barometer.web" = ["static/*", "static/**/*"]
