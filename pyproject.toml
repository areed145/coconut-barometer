[project]
name = "flickr-organizer"
version = "0.1.0"
description = "Auto-tag and album-sort a Flickr library using geotags and vision LLMs"
requires-python = ">=3.10"
dependencies = [
    "flickrapi>=2.4",
    "pyyaml>=6",
    "requests>=2.28",
    "reverse_geocoder>=1.5",
    "pycountry>=22",
    "anthropic>=0.40",
    "fastapi>=0.156.1",
    "uvicorn>=0.54.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]   # also used for Ollama / other OpenAI-compatible servers

# `uv sync` installs the project (editable) plus the dev group; `uv sync --no-dev` for a server.
[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[project.scripts]
flickr-organizer = "flickr_organizer.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flickr_organizer*"]

[tool.setuptools.package-data]
"flickr_organizer.review" = ["static/*"]
"flickr_organizer.web" = ["static/*", "static/**/*"]
