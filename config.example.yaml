# A starting point, all optional: the app runs without any config.yaml (defaults + Settings in the
# web app, which are saved in the database). Either copy this to config.yaml and edit it, or load it
# into Settings once: `coconut-barometer settings import-file config.example.yaml`.
# config.yaml is gitignored; API keys are better set in Settings (stored encrypted).

flickr:
  api_key: ""            # https://www.flickr.com/services/apps/create/
  api_secret: ""

database: db.duckdb   # local state: photo cache, classifications, decisions (this is the default)

albums:
  # Your albums mostly exist already, so by default the tool only adds photos to
  # albums whose title it can find. Set true to also propose creating missing ones.
  create_missing: false

# A photo's tags are proposed as one list that replaces them, so a tag of yours that nothing
# proposes would be taken off. always_add puts tags on every photo's list; always_remove keeps
# tags off it, even when the model or a rule suggests them (* and ? are wildcards).
tags:
  always_add: []                # e.g. [adam reeder, coconutbarometer]
  always_remove: []             # e.g. [awesome, cool, "www*"]

# Groups to add each public photo to: the ones it fits best among those you're in, judged by
# the photos you've already put in each (a group needs 3 of yours to learn from).
groups:
  suggest: true
  max_per_photo: 3
  min_match: 3.0                # higher: fewer, surer suggestions

# Location albums from each photo's geotag (location tags are standard_tags.place, below).
geo:
  # Flickr geo accuracy: 1=world, 3=country, 6=region, 11=city, 16=street (phone GPS).
  min_accuracy:
    country: 1
    state: 6
    city: 11
  countries:
    # An album named after the country (e.g. "Japan", "South Korea") is found by itself.
    # ISO code -> your album title(s), for when your album names differ.
    aliases:
      US: "United States"
      GB: "U.K."
      # Your multi-country trip albums
      AR: "Argentina, Chile, Uruguay"
      CL: "Argentina, Chile, Uruguay"
      UY: "Argentina, Chile, Uruguay"
      HR: "Croatia, Bosnia, Montenegro"
      BA: "Croatia, Bosnia, Montenegro"
      ME: "Croatia, Bosnia, Montenegro"
      EC: "Galapagos, Ecuador"
      HU: "Hungary, Slovakia"
      SK: "Hungary, Slovakia"
      IL: "Israel, West Bank, Golan"
      PS: "Israel, West Bank, Golan"
      SY: "Israel, West Bank, Golan"   # Golan Heights can geocode to Syria; you have no Syria album
      TH: "Thailand, Vietnam, Laos, Cambodia, Myanmar"
      VN: "Thailand, Vietnam, Laos, Cambodia, Myanmar"
      LA: "Thailand, Vietnam, Laos, Cambodia, Myanmar"
      KH: "Thailand, Vietnam, Laos, Cambodia, Myanmar"
      MM: "Thailand, Vietnam, Laos, Cambodia, Myanmar"
      HK: "China"
      MO: "China"
      # Leeward Islands: Antigua & Barbuda, St Kitts & Nevis, Montserrat, Anguilla,
      # BVI, USVI, St Martin / Sint Maarten, St Barths, Guadeloupe
      AG: "Leeward Islands"
      KN: "Leeward Islands"
      MS: "Leeward Islands"
      AI: "Leeward Islands"
      VG: "Leeward Islands"
      VI: "Leeward Islands"
      MF: "Leeward Islands"
      SX: "Leeward Islands"
      BL: "Leeward Islands"
      GP: "Leeward Islands"
  us_states:
    enabled: true
    title: "{state}"      # matches your Arizona, California, Texas, ... albums
  # Cities are matched by distance, which is more reliable than place names.
  # "Sierras" is too long and thin for a circle, so it's left to you.
  cities:
    - album: "Bakersfield"
      lat: 35.3733
      lon: -119.0187
      radius_km: 25
    - album: "Houston"
      lat: 29.7604
      lon: -95.3698
      radius_km: 50
    - album: "Coachella Valley"     # Palm Springs to Indio
      lat: 33.7700
      lon: -116.3500
      radius_km: 30
    - album: "Death Valley"         # Furnace Creek
      lat: 36.4570
      lon: -116.8660
      radius_km: 60
    - album: "Monterey Bay"
      lat: 36.8000
      lon: -121.9000
      radius_km: 35
    - album: "Mt. Whitney"          # summit; covers the trail and Whitney Portal
      lat: 36.5785
      lon: -118.2923
      radius_km: 15

# The model that looks at each photo. Every photo gets a proposed title, description,
# tags and albums from it; you accept or decline each one in the reviewer.
vision:
  provider: claude        # claude | openai | ollama
  model: claude-haiku-5-5 # cheapest; use claude-sonnet-5-5 for harder judgement calls
  api_key: ""            # Anthropic or OpenAI key (https://console.anthropic.com/); not needed for ollama
  # base_url: http://localhost:11434/v1   # for ollama / other OpenAI-compatible servers
  min_confidence: 0.6    # categories below this are not proposed
  use_photo_text: true    # give the model your title/description/tags as context
  use_location: true      # give it the town/state/country from the geotag (helps name landmarks)
  extra_tags:              # descriptive tags from the model (e.g. "ramen", "heron")
    max: 8                # room for landmarks, aircraft types and species
  # The description it writes. Proposed for every photo, yours included: you decide.
  # `instructions` is the brief the model gets; edit it freely ({max_words} is filled
  # in). Delete it to use the built-in default. Whatever it says, the model is also told
  # never to guess a location or name a person. Editing it re-runs the model once for
  # the photos it applies to (~$0.0006 each), and proposes the new text.
  describe:
    max_words: 40
    instructions: >
      Write the description for the photo's Flickr page, like a short caption beside a
      print in a gallery: 1-2 sentences, at most {max_words} words. Notice what makes
      this frame worth looking at - the light, color, texture, scale, composition, the
      mood or the moment - and the specific place. Be concrete and observant; one
      precise detail is better than several adjectives. Keep the tone understated: no
      superlatives or travel-brochure words ("stunning", "breathtaking", "majestic",
      "nestled", "vibrant", "hidden gem", "tapestry"), no exclamation marks, and don't
      start with "This photo", "This image" or "A view of".
  # The title it proposes, for every photo (you approve or decline each one).
  title:
    max_words: 8
    instructions: >
      Propose a title for the photo, like the title of a print in an exhibition: 2 to
      {max_words} words, specific and quietly evocative, naming the subject, the moment
      or the light rather than describing the whole frame. Include the place when it
      helps, e.g. "Low Tide, Alki Beach", "Fog Lifting off Puget Sound", "Last Light on
      the Treasury, Petra". No hype words, no quotation marks or ending punctuation, no
      file names.
  # One entry per album you want filled by subject. The description is what the
  # model sees, so be specific about edge cases.
  categories:
    food:
      album: "Food"
      description: >
        Food or drink is a main subject: plated dishes, meals, desserts, baked goods,
        cocktails, coffee, beer, market produce. NOT just a restaurant interior or a
        person eating where the food is incidental.
      tags: [food]
    landscape:
      album: "Landscapes"
      description: >
        Natural scenery is the main subject: mountains, coastlines, beaches, deserts,
        forests, lakes, canyons, wide outdoor vistas, including aerial views of terrain
        taken from an aircraft. Cityscapes and street scenes do not count.
      tags: [landscapes]
    sunsets:
      album: "Sunsets / Sunrises"
      description: >
        The sun is at or near the horizon and the sky is lit in sunset/sunrise colors
        (orange, pink, red, gold), or the sun itself is setting/rising in frame.
        Silhouettes against such a sky count. Ordinary daytime blue sky does not.
      tags: [sunset]
    clouds:
      album: "Clouds"
      description: >
        Clouds or the sky are a main subject: dramatic cloud formations, storms,
        rain shafts, cumulus towers, cloud layers seen from an aircraft. NOT a photo
        that just happens to have some clouds in the background.
      tags: [clouds]
    animals:
      album: "Animals"
      description: >
        A living animal (wild, pet, farm, zoo, bird, insect, marine life, fish) is a
        main subject and clearly visible. Statues or carvings of animals do not count.
      tags: [animals]
    plants:
      album: "Plants"
      description: >
        A plant is a main subject: flowers, trees, cacti, leaves, succulents, gardens,
        palms, close-ups of foliage. A forest or field seen as distant scenery is a
        landscape, not a plant photo.
      tags: [plants]
    flowers:
      album: "Flowers"
      description: >
        One or more flowers/blossoms are a main subject, usually close up. Green
        foliage or cacti without blooms do not count.
      tags: [flowers]
    hibiscus:
      album: "Hibiscus"
      description: >
        A hibiscus flower (large, five-petaled tropical bloom with a long protruding
        central stamen column) is a main subject. Score other flowers low.
      tags: [hibiscus]
    architecture:
      album: "Architecture"
      description: >
        A building, bridge, monument, ruin, church, temple, skyline, interior space,
        or architectural detail is the main subject.
      tags: [architecture]
    people:
      album: "People"
      description: >
        One or more people are a main subject: portraits, locals, street life, friends,
        groups, crowds at an event. NOT tiny distant figures in a landscape.
      tags: [people]
    text:
      album: "Text"
      description: >
        Written text is a main subject and legible: signs, street signs, plaques,
        menus, posters, billboards, notices, labels, lettering on a wall. NOT text
        that is a small incidental part of the frame.
      tags: [text]
    music:
      album: "Music"
      description: >
        Live music or musicians: concerts, festival stages, bands, street musicians,
        people playing instruments, or a musical instrument as the subject.
      tags: [music, concerts]
    vehicles:
      album: "Vehicles"
      description: >
        A vehicle is a main subject: cars, trucks, buses, motorcycles, tuk-tuks,
        trains, boats, ships, and aircraft. NOT a street scene where vehicles are
        just passing in the background.
      tags: [vehicles]
    aviation:
      album: "Aviation"
      description: >
        Anything about flying: airplanes, helicopters, gliders or paragliders (on the
        ground or in the air), cockpits and instrument panels, airports and runways,
        airshows, and photos taken from an aircraft in flight where a wing, strut,
        propeller or window frame is visible.
      tags: [aviation]
    military_aviation:
      album: "Military Aviation"
      description: >
        A military aircraft is a main subject: fighters, bombers, warbirds (P-51,
        Spitfire, B-17, Corsair, etc.), military jets, transports or helicopters in
        military markings or camouflage, military airshow demo teams (Blue Angels,
        Thunderbirds). Civilian planes do not count.
      tags: [military, aviation]
    soaring:
      album: "Soaring"
      description: >
        A glider/sailplane (long thin wings, no engine), a tow plane launching one,
        or the view from a glider cockpit. Powered light aircraft do not count.
      tags: [soaring, glider]
    paragliding:
      album: "Paragliding"
      description: >
        Paragliding or hang gliding: a paraglider canopy/wing in the air or laid out
        on a launch hill, pilots in harnesses, or the view from under a paraglider.
      tags: [paragliding]
    sailing:
      album: "Sailing"
      description: >
        Sailboats or sailing: a sailing yacht or catamaran is a main subject, or the
        photo is taken aboard one (sails, rigging, mast, deck visible). Motorboats,
        ferries and cruise ships do not count.
      tags: [sailing]
    scuba:
      album: "Scuba"
      description: >
        The photo was taken underwater: reefs, fish, divers, wrecks, kelp. Also
        divers in scuba gear at the surface or on a dive boat.
      tags: [scuba, underwater]
    fishing:
      album: "Fishing"
      description: >
        Fishing: someone holding a fish they caught, rods, reels, lures, people
        casting, fishing boats in use. A fish swimming underwater does not count
        (that's scuba/animals).
      tags: [fishing]
    # "Style" (571 photos) is your "artistic shot" album: reflections, silhouettes,
    # odd angles, bold color. That's a judgement call the model will make very
    # differently from you, so it's off. Uncomment to try it on a small batch.
    style:
      album: "Style"
      description: >
        An artistic, deliberately composed shot where the composition itself is the
        point: strong reflections, silhouettes, symmetry, abstract patterns, bold
        color, unusual angles, shallow depth of field. NOT an ordinary snapshot.
      tags: [style]

# Tags you apply by convention. Each group has its own flag. They all go into the photo's
# single tags change, so it's still one Flickr call per photo. The reviewer proposes them
# in the photo's whole tag list, which replaces its tags once you approve it.
standard_tags:

  # 1. Date, from the date taken. Fields: {year} {month} {day} {season}
  #    Seasons follow the northern calendar (Dec-Feb winter), as your tags do.
  date:
    enabled: true
    formats: ["y{year}", "m{month:02d}", "d{day:02d}"]   # your newer style: y2019 m07 d17
    # formats: ["{year}", "{season}"]                    # your older style: 2011 summer

  # 2. Place, from the geotag (uses geo.min_accuracy for country/state/city): country, region
  #    (americas+northamerica, europe+westerneurope ...), state, US state abbreviation, and the
  #    nearest town or your geo.cities name.
  #    e.g. unitedstates americas northamerica california ca bakersfield
  place:
    enabled: true

  # 3. Camera, from EXIF. Run `python -m coconut_barometer camera` first (one call per
  #    photo, cached; `process` keeps it up to date). Tags are the words of Flickr's camera
  #    name: "Nikon D90" -> nikon d90, "Apple iPhone X" -> apple iphone x.
  camera:
    enabled: true
    name_words: true
    albums:                   # also add to your camera albums
      - {match: "^nikon", album: "Nikon"}
      - {match: "^canon", album: "Canon"}
      - {match: "^sony", album: "Sony"}
      - {match: "iphone", album: "iPhone"}

# How often each kind of sync runs (`sync` and the web app's scheduler do whatever is due).
schedule:
  full_every_days: 7            # everything (~180 calls for 10k photos)
  photo_list_every_hours: 24    # every photo re-read: view counts + the daily snapshot (~22 calls)
  stats: true                   # per-day stats from Flickr (Pro): yesterday, plus backfill
  backfill_days_per_run: 7      # older days per run, until Flickr has none (~6 calls a day)
  # Photos uploaded since the last sync go under Review → To review, either way:
  #   queue    processed when you open each one (vision is paid for as you go)
  #   process  processed right after the sync
  new_photos: queue

review:
  # Photos without a geotag go to review with a guessed location (from photos taken around the
  # same time, place names in the title and tags, and the vision model's words), or none, to pick
  # on the map. The daily re-read of every photo sends any not already in review.
  missing_location: true

# The web app (`coconut-barometer serve`). With no login yet it opens on a setup page
# (or: `coconut-barometer user add <name>`).
# On a server keep host 127.0.0.1 and put Caddy (HTTPS) in front. API keys belong in Settings
# (stored encrypted), not here.
web:
  host: 127.0.0.1
  port: 8000
  allowed_hosts: [localhost, 127.0.0.1]   # add your domain, e.g. photos.example.com
  secure_cookies: true          # false only for http://localhost testing
  session_days: 14
  sync_every_minutes: 60        # 0 turns the scheduler off
  api_docs: false               # /api/docs, behind the login
  trusted_proxies: [127.0.0.1]  # where X-Forwarded-For / -Proto are believed from (Caddy)

# The Map page uses CARTO tiles. Create a key at carto.com/basemaps/apikey and restrict
# it to your site; the key is visible in map tile requests. The cluster colors are below.
map:
  carto_key: ""
  expand_at: 40                 # clusters this size or smaller open into photo cards

theme:
  color_low: "#f7d125"          # low counts on the map and analytics charts
  color_high: "#1dab45"         # high counts

# The web app makes compressed backups on its scheduler. 0 disables automatic backups.
backup:
  every_hours: 24
  keep: 7
  # dir: /path/to/backups       # default: backups/ beside the database
