# The whole test suite on every push and pull request, with the versions in uv.lock.
# 3.14 is what the Docker image runs; 3.15 is the local .python-version.
name: Tests

on:
  push:
  pull_request:

concurrency:                      # a newer push to the same branch cancels the run it replaces
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"       # as in the Dockerfile
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
