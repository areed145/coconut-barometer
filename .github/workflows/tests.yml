# The whole test suite on every push and pull request, with the versions in uv.lock, on
# Python 3.14: what the Docker image runs.
name: Tests

on:
  push:
  pull_request:

concurrency:                      # a newer push to the same branch cancels the run it replaces
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7               # Node 24 actions (Node 20 is deprecated on the runners)
      - uses: astral-sh/setup-uv@v10.2.0        # no floating major tags since v8; caches by default (auto)
        with:
          version: "0.13.4"       # uv and Python as in the Dockerfile
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
